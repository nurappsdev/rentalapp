name: alora
description: "Alora Render Aplication"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.7.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # getx state management
  get: ^4.7.2
  # dio network handler
  dio: ^5.8.0+1
  # date formatter
  intl: ^0.20.2
  # secure shared prefferences
  flutter_secure_storage: ^9.2.4
  # strong vibration
  vibration: ^3.1.3
  # loader animation
  flutter_spinkit: ^5.2.1
  # image picker
  image_picker: ^1.1.2
  # file picker
  file_picker: ^10.2.0
  # logger log info, error, dubug, warning
  logger: ^2.5.0
  # internet connectivity checker
  connectivity_plus: ^6.1.4
  # permission handler
  permission_handler: ^12.0.0+1
  # image caching
  cached_network_image: ^3.4.1
  # pin code fields
  pin_code_fields: ^8.0.1
  # svg icons loader
  flutter_svg: ^2.1.0
  # app launcher icon
  flutter_launcher_icons: ^0.14.3
  # calendar
  calendar_date_picker2: ^2.0.1
  # shimmer loader
  shimmer: ^3.0.0
  # video player
  video_player: ^2.10.0
  # video controller
  chewie: ^1.11.3
  # visiblity detect
  visibility_detector: ^0.4.0+2
  # country code
  country_code_picker: ^3.3.0
  # url lanch
  url_launcher: ^6.3.1
  # path provide
  path_provider: ^2.1.5
  # open a file 
  open_file: ^3.5.10
  flip_card: ^0.7.0
 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

  fonts:
   - family: RedHatDisplay
     fonts:
       - asset: assets/fonts/RedHatDisplay-Light.ttf
         weight: 300
       - asset: assets/fonts/RedHatDisplay-Regular.ttf
         weight: 400
       - asset: assets/fonts/RedHatDisplay-Medium.ttf
         weight: 500
       - asset: assets/fonts/RedHatDisplay-SemiBold.ttf
         weight: 600
       - asset: assets/fonts/RedHatDisplay-Bold.ttf
         weight: 700
       - asset: assets/fonts/RedHatDisplay-ExtraBold.ttf
         weight: 800